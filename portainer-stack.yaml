version: '3.8'
services:
  # fastapi:
  #   build:
  #     context: ./fastapi_automatic_instrumentalization
  #   ports:
  #     - "8080:80"
  #   environment:
  #     - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
  #     - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
  #     - OTEL_EXPORTER_OTLP_INSECURE=true
