  #     - OTEL_SERVICE_NAME=staging-jsonfy-admin
  #     # - OTEL_EXPORTER_OTLP_PROTOCOL="http/protobuf" # if your are using otel-collector:4318/http
  #   depends_on:
  #     - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command:
      - --config=/etc/otel-collector-config.yaml
      - --feature-gates=service.profilesSupport
    ports:
      - 13133:13133
      - 4317:4317
      - 4318:4318
      - 1888:1888
      - 8859:8889
    depends_on:
      - loki
      - mimir
      - tempo
      - pyroscope
      - prometheus
    env_file:
      - stack.env
    # networks:
    #   - proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      # - prometheus-data:/prometheus
      - /root/fastapi-automatic-otel-lgtm-s3/config/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --enable-feature=remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    # networks:
    #   - proxy

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/mimir-config.yaml:/etc/mimir.yaml
      # - /root/fastapi-automatic-otel-lgtm-s3/config/alert/mimir-alertmanager-fallback-config.yaml:/etc/mimir/alertmanager-fallback-config.yaml
      # - mimir-data:/data
    command:
      - --config.file=/etc/mimir.yaml
      - --config.expand-env=true


  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    restart: unless-stopped
    user: "0:0"
    ports:
      - "4040:4040"
      - "4041:4041"
    env_file:
      - stack.env
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/pyroscope-config.yaml:/etc/pyroscope/server.yaml
      - pyroscope-data:/data/pyroscope
    command:
      - --config.file=/etc/pyroscope/server.yaml
      - --config.expand-env=true
    # networks:
    #   - proxy

  loki:
    image: grafana/loki:latest
    container_name: grafana-loki
    restart: unless-stopped
    ports:
      - 3100:3100
    env_file:
      - stack.env
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/loki-config.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    # networks:
    #   - proxy

  tempo:
    image: grafana/tempo:latest
    container_name: grafana-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    env_file:
      - stack.env
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/tempo-config.yaml:/etc/tempo/tempo-config.yaml
    command: -config.file=/etc/tempo/tempo-config.yaml -config.expand-env=true
    # networks:
    #   - proxy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - stack.env
    # environment:
    #   GF_DATABASE_TYPE: postgres
    #   GF_DATABASE_HOST: grafana-db:5432
    #   GF_DATABASE_NAME: grafana
    #   GF_DATABASE_USER: grafana
    #   GF_DATABASE_PASSWORD: grafana_pass
    #   GF_DATABASE_SSL_MODE: disable
    #   GF_SERVER_ROOT_URL: http://localhost:3000
    #   GF_LOG_MODE: console
    #   GF_LOG_LEVEL: info
    #   GF_SECURITY_ADMIN_USER: admin
    #   GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - /root/fastapi-automatic-otel-lgtm-s3/config/grafana/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/grafana-dashboards.yaml
      - /root/fastapi-automatic-otel-lgtm-s3/config/grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - /root/fastapi-automatic-otel-lgtm-s3/dashboards:/var/lib/grafana/dashboards
    # networks:
    #   - proxy

  # grafana-db:
  #   image: postgres:15
  #   container_name: grafana-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: grafana
