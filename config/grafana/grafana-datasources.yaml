apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: true
    jsonData:
      pdcInjected: false

      tracesToLogsV2:
        customQuery: true
        datasourceUid: "loki"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"

      tracesToMetrics:
        datasourceUid: "prometheus"
        queries:
          - name: "Metrics"
            query: '{method="GET"}'
        tags:
          - key: "service.name"
            value: "service_name"

      tracesToProfiles:
        datasourceUid: "pyroscope"
        profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
        tags:
          - key: "service.name"
            value: "service_name"

      search:
        hide: false
        filters:
          - id: "service-name"
            operator: "="
            scope: "resource"
            tag: "service.name"
          - id: "span-name"
            operator: "="
            scope: "span"
            tag: "name"
      serviceMap:
        datasourceUid: "prometheus"
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "loki"

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "tempo"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://pyroscope:4040
    isDefault: false
    editable: true
    jsonData:
      pdcInjected: false

  - name: mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:8080
    isDefault: false
    editable: true
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
      pdcInjected: false
    secureJsonData:
      httpHeaderValue1: "I1pHVjJOSEkxTm1sa2RYWnBPR0UjKllXVnpMV05tWWcqOXBwSWttWEKQmTPPcBCCXsTAmHbUgnSzQtwcog=="
