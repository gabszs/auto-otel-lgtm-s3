---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}
      # filesystem: {}   # remove se não precisa
      # process: {}      # remove se não precisa
      # processes: {}    # remove se não precisa

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"
    
connectors:
  spanmetrics:
    namespace: traces.spanmetrics  # Prefix for generated metrics
    histogram:
      unit: s  # Seconds for duration
    dimensions:
      - name: http.method
        default: GET
      - name: http.status_code
    exemplars:
      enabled: true
  servicegraph:
    latency_histogram_buckets: [100ms, 250ms, 1s, 5s, 10s]

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/traces:
    endpoint: tempo:4317
    tls:
      insecure: true
    # sending_queue:
    #   enabled: true
  otlphttp/profiles:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: detailed
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/traces, spanmetrics, servicegraph]      
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlphttp/profiles]
