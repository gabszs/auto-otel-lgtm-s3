---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}

  postgresql/password_service:
    endpoint: "${OTEL_POSTGRESQL_HOST}"
    transport: tcp
    username: "${OTEL_POSTGRESQL_USER}"
    password: "${OTEL_POSTGRESQL_PASSWORD}"
    databases:
      - "${OTEL_POSTGRESQL_DB}"
    collection_interval: 10s
    events:
      db.server.query_sample:
        enabled: true
      db.server.top_query:
        enabled: true
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/health"
    
  basicauth/grafana_cloud:
    client_auth:
      username: "${GF_LABS_COLLECTOR_USER_ID}"
      password: "${GF_LABS_COLLECTOR_API_KEY}"

  bearertokenauth/dash0:
    scheme: Bearer
    token: "${DASH0_AUTHORIZATION_TOKEN}"
  
processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

  probabilistic_sampler:
    sampling_percentage: 5.0
    mode: proportional

  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Redact email + sufixos extras
          - replace_pattern(span.attributes["http.request.body"], "(\"email\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          # Redact username/user + sufixos extras
          - replace_pattern(span.attributes["http.request.body"], "(\"(username|user)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          # Redact password + sufixos extras
          - replace_pattern(span.attributes["http.request.body"], "(\"password\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          # Redact API keys + sufixos extras
          - replace_pattern(span.attributes["http.request.body"], "(\"(api[_-]?key|apiKey|api[_-]?token)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")          
          # Redact tokens/authorization + sufixos extras
          - replace_pattern(span.attributes["http.request.body"], "(\"(authorization|token|bearer)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")

  resource/postgresql:
    attributes:
      - key: service.host
        value: "192.168.1.3:5443"
        action: insert
      - key: service.name
        value: postgresql-password-service
        action: insert

  transform/system_metrics:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - set(description, "System CPU time") where name == "system.cpu.time"
          - set(description, "System disk IO") where name == "system.disk.io"
          - set(description, "System disk operations") where name == "system.disk.operations"

connectors:
  forward: {}

exporters:
  # grafana labs
  otlp_http/grafana:
    endpoint: ${GF_LABS_COLLECTOR_URL}
    headers:
      authorization: ${GF_LABS_AUTH_HEADER}
      
  # hyper-dx
  otlp_http/hdx:
    endpoint: 'http://192.168.1.3:4338'
    headers:
      authorization: ${HDX_API_KEY}
    compression: gzip

  # OllyGarden
  otlp_http/ollygarden:
    endpoint: "https://in.ollygarden.cloud"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    headers:
      Authorization: "Bearer ${OLLY_API_KEY}"

  # Datadog (comentado - descomentar se for usar)
  # datadog/exporter:
  #   api:
  #     site: "datadoghq.com"
  #     key: ${DATADOG_API_KEY}

  # grafana prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  # Loki
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Tempo
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Pyroscope
  otlp_http/pyroscope:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

  # Pyroscope
  otlp_grpc/dash0:
    auth:
      authenticator: bearertokenauth/dash0
    endpoint: ingress.us-west-2.aws.dash0.com:4317
    headers:
      Dash0-Dataset: default

service:
  extensions:
    - health_check
    - basicauth/grafana_cloud
    - bearertokenauth/dash0

  telemetry:
    metrics:
      level: detailed

  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [otlp_grpc/tempo, otlp_http/hdx, otlp_http/grafana, otlp_grpc/dash0, forward]

    traces/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp_http/ollygarden]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki, otlp_http/hdx, otlp_http/grafana, otlp_grpc/dash0, forward]

    logs/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp_http/ollygarden]

    metrics/system:
      receivers: [hostmetrics]
      processors: [batch]
      exporters: [prometheus]

    metrics/postgres:
      receivers: [postgresql/password_service]
      processors: [resource/postgresql, batch]
      exporters: [prometheus, otlp_http/hdx, otlp_http/grafana]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, otlp_http/hdx, otlp_http/ollygarden, otlp_http/grafana, otlp_grpc/dash0]
      
    profiles:
      receivers: [otlp]
      exporters: [otlp_http/pyroscope, otlp_http/grafana]
