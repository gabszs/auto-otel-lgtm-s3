---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
      grpc:
        endpoint: 0.0.0.0:4317

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    resource_attributes:
      host.name:
        enabled: true
    env_resources_attributes:
      - container.label.com.docker.compose.project

  prometheus:
    config:
      scrape_configs:
        - job_name: docker-daemon
          static_configs:
            - targets: ['192.168.1.3:9323']
          relabel_configs:
            - target_label: host_name
              replacement: "docker-portainer"
            - target_label: docker_host
              replacement: "docker-portainer"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/health"

  basicauth/grafana_cloud:
    client_auth:
      username: "${env:GF_LABS_COLLECTOR_USER_ID}"
      password: "${env:GF_LABS_COLLECTOR_API_KEY}"

  bearertokenauth/dash0:
    scheme: Bearer
    token: "${DASH0_AUTHORIZATION_TOKEN}"

processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

  probabilistic_sampler:
    sampling_percentage: 5.0
    mode: proportional

  probabilistic_sampler/dash0:
    sampling_percentage: 0.5
    mode: proportional

  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.attributes["http.request.body"], "(\"email\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          - replace_pattern(span.attributes["http.request.body"], "(\"(username|user)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          - replace_pattern(span.attributes["http.request.body"], "(\"password\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          - replace_pattern(span.attributes["http.request.body"], "(\"(api[_-]?key|apiKey|api[_-]?token)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")
          - replace_pattern(span.attributes["http.request.body"], "(\"(authorization|token|bearer)\"\\s*:\\s*\")([^\"]*)(\")[^,}\\s]*", "$$1***REDACTED***$$3")

  resource/postgresql:
    attributes:
      - key: service.host
        value: "192.168.1.3:5443"
        action: insert
      - key: service.name
        value: postgresql-password-service
        action: insert

  # Força host.name e docker_host nas métricas do docker_stats
  # O receiver docker_stats pega o hostname do container, não do host —
  # esse processor sobrescreve com o valor correto da máquina física.
  resource/docker_host:
    attributes:
      - key: host.name
        value: "docker-portainer"   # resultado de: hostname
        action: upsert           # upsert sobrescreve se já existir
      - key: docker_host
        value: "docker-portainer"
        action: insert

  transform/system_metrics:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - set(description, "System CPU time") where name == "system.cpu.time"
          - set(description, "System disk IO") where name == "system.disk.io"
          - set(description, "System disk operations") where name == "system.disk.operations"

connectors:
  forward: {}

exporters:
  otlp_http/hdx:
    endpoint: 'http://192.168.1.3:4338'
    headers:
      authorization: ${HDX_API_KEY}
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 5s
      max_elapsed_time: 10s

  otlp_http/grafana:
    endpoint: ${GF_LABS_COLLECTOR_URL}
    auth:
      authenticator: basicauth/grafana_cloud
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 5s
      max_elapsed_time: 10s

  otlp_http/ollygarden:
    endpoint: "https://in.ollygarden.cloud"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    headers:
      Authorization: "Bearer ${OLLY_API_KEY}"

  otlp_grpc/dash0:
    auth:
      authenticator: bearertokenauth/dash0
    endpoint: ingress.us-west-2.aws.dash0.com:4317
    headers:
      Dash0-Dataset: default

  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/pyroscope:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

  otlp_http/lb:
    endpoint: http://192.168.1.3:4358

service:
  extensions:
    - health_check
    - basicauth/grafana_cloud
    - bearertokenauth/dash0

  telemetry:
    metrics:
      level: detailed

  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [otlp_http/lb, otlp_grpc/tempo, otlp_http/grafana, otlp_http/hdx, forward]

    traces/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp_http/ollygarden]

    traces/dash0:
      receivers: [forward]
      processors: [probabilistic_sampler/dash0, batch]
      exporters: [otlp_grpc/dash0]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/lb, otlp_http/loki, otlp_http/grafana, otlp_http/hdx, forward]

    logs/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp_http/ollygarden]

    logs/dash0:
      receivers: [forward]
      processors: [probabilistic_sampler/dash0, batch]
      exporters: [otlp_grpc/dash0]

    metrics:
      receivers: [otlp]
      processors: [batch]   # resource/docker_host antes do batch
      exporters: [otlp_http/lb, prometheus, otlp_http/ollygarden, otlp_http/hdx, otlp_http/grafana]

    metrics/host-name:
      receivers: [docker_stats, prometheus]
      processors: [resource/docker_host, batch]   # resource/docker_host antes do batch
      exporters: [otlp_http/lb, prometheus, otlp_http/ollygarden, otlp_http/hdx, otlp_http/grafana]

    profiles:
      receivers: [otlp]
      exporters: [otlp_http/pyroscope, otlp_http/grafana]
