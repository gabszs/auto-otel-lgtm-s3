---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}
      # filesystem: {}   # remove se não precisa
      # process: {}      # remove se não precisa
      # processes: {}    # remove se não precisa

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/health"

processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

  probabilistic_sampler:
    sampling_percentage: 5.0   # ajuste se quiser (ex: 10.0)
    mode: proportional

connectors:
  forward: {}
  datadog/connector:
    
exporters:
  # grafana labs
  otlphttp/grafana:
    endpoint: https://otlp-gateway-prod-sa-east-1.grafana.net/otlp
    headers:
      Authorization: "Bearer ${GF_LABS_COLLECTOR_API_KEY}" 
      
  # hyper-dx
  # HTTP setup
  otlphttp/hdx:
    endpoint: 'http://192.168.1.3:4338'
    headers:
      authorization: ${HDX_API_KEY}
    compression: gzip

  # OllyGarden
  otlphttp/ollygarden:
    endpoint: "https://in.ollygarden.cloud"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    headers:
      Authorization: "Bearer ${OLLY_API_KEY}"

  # Datadog
  datadog/exporter:
    api:
      site: "datadoghq.com"
      key: ${DATADOG_API_KEY}

  # grafana
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # sending_queue:
    #   enabled: true

  otlphttp/pyroscope:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

service:
  extensions:
    - health_check
  telemetry:
    metrics:
      level: detailed
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, otlphttp/hdx, otlphttp/grafana, forward] # datadog/connector, datadog/exporter

    traces/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlphttp/ollygarden]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, otlphttp/hdx, otlphttp/grafana, forward] # datadog/exporter

    logs/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlphttp/ollygarden]

    metrics:
      receivers: [otlp, hostmetrics] # datadog/connector
      processors: [batch]
      exporters: [prometheus, otlphttp/hdx, otlphttp/ollygarden, otlphttp/grafana] # datadog/exporter
      
    profiles:
      receivers: [otlp]
      exporters: [otlphttp/pyroscope, otlphttp/grafana]
