---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}
      # filesystem: {}   # remove se não precisa
      # process: {}      # remove se não precisa
      # processes: {}    # remove se não precisa

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
    timeout: 5s

  probabilistic_sampler:
    sampling_percentage: 5.0   # ajuste se quiser (ex: 10.0)
    mode: proportional

connectors:
  forward: {}
    
exporters:
  # hyper-dx
  # HTTP setup
  otlphttp/hdx:
    endpoint: 'http://192.168.1.3:4338'
    headers:
      authorization: "a7f549b1-c84b-4798-9809-b74c676540b5"
    compression: gzip

  # OllyGarden
  otlphttp/ollygarden:
    endpoint: "https://in.ollygarden.cloud"
    headers:
      Authorization: "Bearer og_sk_ibEE57_5defe5669c31cfbd0eaf1e435bb59bab"

  # grafana
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/traces:
    endpoint: tempo:4317
    tls:
      insecure: true
    # sending_queue:
    #   enabled: true
  otlphttp/profiles:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: detailed
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/traces, otlphttp/hdx, forward]
    traces/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlphttp/ollygarden]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs, otlphttp/hdx, forward]
    logs/ollygarden:
      receivers: [forward]
      processors: [probabilistic_sampler, batch]
      exporters: [otlphttp/ollygarden]

    metrics:
      receivers: [otlp, hostmetrics]
      processors: [batch]
      exporters: [prometheus, otlphttp/hdx, otlphttp/ollygarden]
      
    profiles:
      receivers: [otlp]
      exporters: [otlphttp/profiles]
