remotecfg {
  url            = env("GCLOUD_FM_URL")
  id             = env("GCLOUD_FM_HOSTED_ID")
  poll_frequency = env("GCLOUD_FM_POLL_FREQUENCY")

  basic_auth {
    username = env("GCLOUD_FM_HOSTED_ID")
    password = env("GCLOUD_RW_API_KEY")
  }
}

otelcol.receiver.otlp "default" {
  grpc {
    endpoint = "0.0.0.0:4317"
  }
  http {
    endpoint = "0.0.0.0:4318"
  }

  output {
    metrics = [otelcol.exporter.prometheus.default.input]
    logs    = [otelcol.exporter.loki.default.input]
  }
}

otelcol.exporter.prometheus "default" {
  forward_to = [prometheus.remote_write.default.receiver]
}

prometheus.remote_write "default" {
  endpoint {
    url = env("GCLOUD_HOSTED_METRICS_URL")

    basic_auth {
      username = env("GCLOUD_HOSTED_METRICS_ID")
      password = env("GCLOUD_RW_API_KEY")
    }
  }
}

otelcol.exporter.loki "default" {
  forward_to = [loki.write.default.receiver]
}

loki.write "default" {
  endpoint {
    url = env("GCLOUD_HOSTED_LOGS_URL")

    basic_auth {
      username = env("GCLOUD_HOSTED_LOGS_ID")
      password = env("GCLOUD_RW_API_KEY")
    }
  }
}

// POSTGRES DBM CONFIG
prometheus.exporter.postgres "postgres_auth" {
  data_source_names  = [env("POSTGRES_DSN")]
  enabled_collectors = ["stat_statements"]

  autodiscovery {
    enabled = true
  }
}

database_observability.postgres "postgres_auth_fastapi" {
  data_source_name  = env("POSTGRES_DSN")
  forward_to        = [loki.relabel.database_observability_postgres_auth_fastapi.receiver]
  targets           = prometheus.exporter.postgres.postgres_auth_fastapi.targets
  enable_collectors = ["query_details", "query_samples", "schema_details", "explain_plans"]
}

loki.relabel "database_observability_postgres_auth_fastapi" {
  forward_to = [loki.write.default.receiver]

  rule {
    target_label = "instance"
    replacement  = "192.168.1.3:5443"
  }
  rule {
    target_label = "db_name"
    replacement  = "app_db"
  }
}

discovery.relabel "database_observability_postgres_auth_fastapi" {
  targets = database_observability.postgres.postgres_auth_fastapi.targets

  rule {
    target_label = "job"
    replacement  = "integrations/db-o11y"
  }
  rule {
    target_label = "instance"
    replacement  = "192.168.1.3:5443"
  }
  rule {
    target_label = "db_name"
    replacement  = "app_db"
  }
}

prometheus.scrape "database_observability_postgres_auth_fastapi" {
  targets    = discovery.relabel.database_observability_postgres_auth_fastapi.output
  forward_to = [prometheus.remote_write.default.receiver]
}
