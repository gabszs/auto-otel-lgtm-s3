auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  http_server_write_timeout: 310s
  http_server_read_timeout: 310s

common:
  path_prefix: /loki
  storage:
    s3:
      endpoint: ${LOKI_BUCKET_ENDPOINT}
      bucketnames: ${LOKI_BUCKET_NAME} # important !!
      # insecure: true
      access_key_id: ${LOKI_ACCESS_KEY}
      secret_access_key: ${LOKI_SECRET_KEY}
      s3forcepathstyle: true # important !!
      region: auto
  replication_factor: 1 # important !!
  ring:
    kvstore:
      store: inmemory

ingester:
  chunk_encoding: snappy
  chunk_idle_period: 2h
  chunk_target_size: 1536000
  max_chunk_age: 2h


querier:
  max_concurrent: 8

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  max_query_parallelism: 24
  split_queries_by_interval: 15m
  ingestion_rate_mb: 20
  ingestion_burst_size_mb: 30
  per_stream_rate_limit: "3MB"
  per_stream_rate_limit_burst: "10MB"
  query_timeout: 300s
  allow_structured_metadata: true
  retention_period: 744h

ruler:
  storage:
    type: s3
    s3:
      endpoint: ${LOKI_BUCKET_ENDPOINT}
      bucketnames: ${LOKI_RULES_BUCKET_NAME}
      # insecure: true
      access_key_id: ${LOKI_ACCESS_KEY}
      secret_access_key: ${LOKI_SECRET_KEY}
      s3forcepathstyle: true
      region: auto

      # FOR MINIO S3
      # endpoint: minio-svc:9000
      # bucketnames: loki-rules # important !!
      # insecure: true
      # access_key_id: ${MINIO_USER}
      # secret_access_key: ${MINIO_PASSWORD}
      # s3forcepathstyle: true

  # FOR OTHER S3 LIKE BUCKETS (IN THIS CASE MAGALU CLOUD)
